<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Receipt Generator</title>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .navbar {
            padding: 15px;
            background: #d71920;
        }

        .navbar a {
            margin-right: 20px;
            color: white;
        }

        .receipt {
            width: 90%;
            max-width: 750px;
            margin: 30px auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
        }

        .receipt h1 {
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .receipt h1:first-child {
            color: white;
            background: #d71920;
        }

        .menu {
            padding: 25px;
        }

        .menu input {
            margin: 10px;
        }

        button {
            width: 90%;
            margin: 20px 5%;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #d71920;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #result {
            padding: 25px;
            white-space: pre-line;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">SKU Generator</a>
        <a href="SkillTest.html">Receipt Generator</a>
    </nav>

    <div class="receipt">

        <h1>Jollibee Fast Food Menu</h1>

        <div class="menu">

            <input type="checkbox" id="Item1" value="80">
            <label for="Item1">Burger - ₱80</label>
            <br>

            <input type="checkbox" id="Item2" value="100">
            <label for="Item2">Chicken with rice - ₱100</label>
            <br>

            <input type="checkbox" id="Item3" value="23">
            <label for="Item3">Fries - ₱23</label>
            <br>

            <input type="checkbox" id="Item4" value="62">
            <label for="Item4">Spaghetti - ₱62</label>
            <br>

        </div>

        <button py-click="calculate_receipt">
            Calculate Receipt
        </button>

        <h1>Receipt</h1>

        <div id="result">
            Select your menu items and click Calculate Receipt.
        </div>

    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
