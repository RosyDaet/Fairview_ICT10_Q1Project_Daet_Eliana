<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>SKU Generator</title>

    <style>
        body {
            margin: 0;
            background: orange;
            font-family: Arial, sans-serif;
        }

        .navbar {
            padding: 15px;
            background: #d71920;
        }

        .navbar a {
            margin-right: 20px;
            color: white;
        }

        .receipt {
            width: 90%;
            max-width: 750px;
            margin: 30px auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
        }

        .receipt h1 {
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .receipt h1:first-child {
            color: white;
            background: #d71920;
        }

        .menu {
            padding: 25px;
        }

        .menu label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .menu input {
            box-sizing: border-box;
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 90%;
            margin: 20px 5%;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #d71920;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #Generater {
            padding: 25px;
            font-size: 20px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">SKU Generator</a>
        <a href="SkillTest.html">Receipt Generator</a>
    </nav>

    <div class="receipt">

        <h1>SKU Generator</h1>

        <div class="menu">

            <label for="Category">Enter Category</label>
            <input
                type="text"
                id="Category"
                placeholder="Example: Food"
                required
            >

            <label for="Product">Enter Product</label>
            <input
                type="text"
                id="Product"
                placeholder="Example: Burger"
                required
            >

            <label for="Quantity">Enter Quantity</label>
            <input
                type="number"
                id="Quantity"
                placeholder="Example: 10"
                min="1"
                step="1"
                required
            >

        </div>

        <button py-click="generate_sku">
            Generate SKU
        </button>

        <h1>Generated SKU</h1>

        <div id="Generater">
            Your SKU will appear here.
        </div>

    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
